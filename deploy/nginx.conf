# Serves the Vite build. This nginx sits *behind* the stack's edge nginx (in the
# backend repo's docker-compose.yml), which terminates :80/:443 and proxies
# everything that is not /api/ here.
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript image/svg+xml;
    gzip_min_length 1024;

    # Vite fingerprints asset filenames, so they can be cached indefinitely.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # The entry point must never be cached, or a deploy keeps serving the old
    # bundle references to returning visitors.
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    # The router uses hash history, so this is a safety net for direct hits on
    # non-root paths (and for a future switch to history mode).
    location / {
        try_files $uri $uri/ /index.html;
    }
}
