name: CI/CD

# build → test → deploy: three jobs, so the run graph shows the stages as
# separate nodes. All of them execute over SSH on the same AlmaLinux 9 VM that
# runs the backend, because this app is the `web` service of the stack defined in
# the backend repo's docker-compose.yml. Nothing is pushed to a registry.
#
# The steps only invoke deploy/ci/pipeline.sh on the VM: appleboy/ssh-action
# rewrites multi-line scripts in transit, so the shell lives in a committed file
# that arrives intact with the checkout.

on:
  push:
    branches: [develop]
  workflow_dispatch:
    inputs:
      ref:
        description: 'Git ref to build and deploy'
        required: false
        default: ''

# The sync step lends this token to the VM for one `git fetch`.
permissions:
  contents: read

# One rollout at a time — a second push waits instead of racing the first
# through docker build and `compose up` on the same host.
concurrency:
  group: cicd-${{ github.ref }}
  cancel-in-progress: false

# ---- Deployment topology. Change a value here, not in the steps. ----
env:
  # This repo's checkout on the VM.
  APP_DIR: /opt/app/greenline-wms-fe
  # The backend checkout, which owns docker-compose.yml and deploy/.env.
  STACK_DIR: /opt/app/greenline-wms-be
  WEB_IMAGE: greenline-wms-web
  WEB_CONTAINER: greenline-wms-web
  HEALTH_TIMEOUT: '90'
  KEEP_IMAGES: '5'

jobs:
  # ===========================================================================
  # 1. BUILD — sync the checkout on the VM and build the nginx image there.
  # ===========================================================================
  build:
    name: Build image on the VM
    runs-on: ubuntu-latest
    # SSH_* and VITE_API_URL are environment secrets/variables, so every job has
    # to declare the environment they live in — without this they resolve to
    # empty strings and the connection fails.
    environment: develop
    # Workflow-level `env:` cannot read `secrets`, so this block is repeated per
    # job — it is the only place in the file that touches `secrets.*`/`vars.*`;
    # every step below refers to these names instead.
    env:
      SSH_HOST: ${{ secrets.SSH_HOST }}
      SSH_PORT: ${{ secrets.SSH_PORT || 22 }}
      SSH_USER: ${{ secrets.SSH_USER }}
      SSH_PASSWORD: ${{ secrets.SSH_PASSWORD }}
      # Baked into the bundle at build time: the site's public origin, no
      # trailing slash and no /api (the app appends that itself).
      VITE_API_URL: ${{ vars.VITE_API_URL }}
    outputs:
      image_tag: ${{ steps.resolve.outputs.image_tag }}
      sha: ${{ steps.resolve.outputs.sha }}
    steps:
      - name: Check out (for .github/actions/remote)
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Resolve commit and image tag
        id: resolve
        env:
          INPUT_REF: ${{ github.event.inputs.ref }}
          REPO: ${{ github.repository }}
          TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if [ -n "$INPUT_REF" ]; then
            SHA="$(git ls-remote "https://x-access-token:${TOKEN}@github.com/${REPO}.git" "$INPUT_REF" | cut -f1 | head -n1)"
            [ -n "$SHA" ] || SHA="$INPUT_REF"   # already a full commit sha
          else
            SHA="${{ github.sha }}"
          fi
          {
            echo "sha=$SHA"
            echo "image_tag=${SHA:0:12}"
          } >> "$GITHUB_OUTPUT"
          echo "Building $SHA as tag ${SHA:0:12}"

      # Inline on purpose: this is the step that updates pipeline.sh, so
      # everything after it runs the script of the commit being deployed.
      - name: Sync checkout on the VM
        uses: ./.github/actions/remote
        with:
          host: ${{ env.SSH_HOST }}
          port: ${{ env.SSH_PORT }}
          username: ${{ env.SSH_USER }}
          password: ${{ env.SSH_PASSWORD }}
          envs: APP_DIR
          script: |
            set -Eeuo pipefail
            GIT_SHA='${{ steps.resolve.outputs.sha }}'
            GH_TOKEN='${{ github.token }}'
            cd "$APP_DIR"
            test -d .git || { echo "$APP_DIR is not a git checkout — clone the repository first"; exit 1; }
            echo "==> Syncing checkout to $GIT_SHA"
            git -c credential.helper= -c credential.helper='!f() { echo username=x-access-token; echo "password=$GH_TOKEN"; }; f' fetch --prune --tags origin
            git reset --hard "$GIT_SHA"
            git clean -fd

      - name: Build image
        uses: ./.github/actions/remote
        with:
          host: ${{ env.SSH_HOST }}
          port: ${{ env.SSH_PORT }}
          username: ${{ env.SSH_USER }}
          password: ${{ env.SSH_PASSWORD }}
          timeout: 30m
          envs: APP_DIR,WEB_IMAGE,VITE_API_URL
          script: |
            set -Eeuo pipefail
            bash "$APP_DIR/deploy/ci/pipeline.sh" build '${{ steps.resolve.outputs.image_tag }}' '${{ steps.resolve.outputs.sha }}'

  # ===========================================================================
  # 2. TEST — the image must serve the app, with the right API origin baked in.
  # ===========================================================================
  test:
    name: Smoke test the built image
    runs-on: ubuntu-latest
    needs: build
    environment: develop
    env:
      SSH_HOST: ${{ secrets.SSH_HOST }}
      SSH_PORT: ${{ secrets.SSH_PORT || 22 }}
      SSH_USER: ${{ secrets.SSH_USER }}
      SSH_PASSWORD: ${{ secrets.SSH_PASSWORD }}
      VITE_API_URL: ${{ vars.VITE_API_URL }}
    steps:
      - name: Check out (for .github/actions/remote)
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Serve the image and check it
        uses: ./.github/actions/remote
        with:
          host: ${{ env.SSH_HOST }}
          port: ${{ env.SSH_PORT }}
          username: ${{ env.SSH_USER }}
          password: ${{ env.SSH_PASSWORD }}
          envs: APP_DIR,WEB_IMAGE,VITE_API_URL
          script: |
            set -Eeuo pipefail
            bash "$APP_DIR/deploy/ci/pipeline.sh" test '${{ needs.build.outputs.image_tag }}'

  # ===========================================================================
  # 3. DEPLOY — point the stack's `web` service at the tested image.
  # ===========================================================================
  deploy:
    name: Deploy (restart web service)
    runs-on: ubuntu-latest
    needs: [build, test]
    environment: develop
    env:
      SSH_HOST: ${{ secrets.SSH_HOST }}
      SSH_PORT: ${{ secrets.SSH_PORT || 22 }}
      SSH_USER: ${{ secrets.SSH_USER }}
      SSH_PASSWORD: ${{ secrets.SSH_PASSWORD }}
    steps:
      - name: Check out (for .github/actions/remote)
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Roll out and wait for health
        uses: ./.github/actions/remote
        with:
          host: ${{ env.SSH_HOST }}
          port: ${{ env.SSH_PORT }}
          username: ${{ env.SSH_USER }}
          password: ${{ env.SSH_PASSWORD }}
          envs: APP_DIR,STACK_DIR,WEB_IMAGE,WEB_CONTAINER,HEALTH_TIMEOUT
          script: |
            set -Eeuo pipefail
            bash "$APP_DIR/deploy/ci/pipeline.sh" deploy '${{ needs.build.outputs.image_tag }}'

      - name: Prune old images
        uses: ./.github/actions/remote
        with:
          host: ${{ env.SSH_HOST }}
          port: ${{ env.SSH_PORT }}
          username: ${{ env.SSH_USER }}
          password: ${{ env.SSH_PASSWORD }}
          envs: APP_DIR,STACK_DIR,WEB_IMAGE,KEEP_IMAGES
          script: |
            set -Eeuo pipefail
            bash "$APP_DIR/deploy/ci/pipeline.sh" prune '${{ needs.build.outputs.image_tag }}'

      - name: Summary
        if: always()
        run: |
          {
            echo "### Deploy ${{ job.status }}"
            echo ""
            echo "| | |"
            echo "|---|---|"
            echo "| Image | \`${WEB_IMAGE}:${{ needs.build.outputs.image_tag }}\` |"
            echo "| Commit | \`${{ needs.build.outputs.sha }}\` |"
          } >> "$GITHUB_STEP_SUMMARY"
