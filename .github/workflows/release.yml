name: Release

# Production pipeline. Same three stages as ci-cd.yml (build → test → deploy) and
# the same deploy/ci/pipeline.sh, but with two differences that matter:
#
#   1. It runs on a push to `main` — i.e. the moment a pull request is merged.
#      develop's pipeline watches `develop`; this one watches `main`.
#   2. Deploy does not happen on its own. Build and test run unattended so every
#      merge is verified immediately, then the deploy job waits on the
#      `production` environment's required reviewers — an admin/maintainer
#      presses the button.
#
# All three jobs read from the single `production` environment, which holds the
# SSH_* connection details plus VITE_API_URL — Vite inlines the API origin at
# build time, so the build stage genuinely needs it.
#
# NOTE: a protection rule applies to *every* job that names the environment. With
# required reviewers on `production`, build and test wait for an approval too — a
# merge does not start compiling until someone clicks through. If you want merges
# to build unattended and only the rollout to be gated, the deploy job's approval
# has to come from an environment that build and test do not name.
#
# Production is a different VM from develop (app.greenlinepetcare.co.th vs
# dev-app.greenlinepetcare.co.th), so container names, ports and paths are free
# to be identical to the develop stack's.

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      ref:
        description: 'Commit on main to build and deploy (blank = current head of main)'
        required: false
        default: ''

permissions:
  contents: read

# Per commit, not per branch. Merges land on main faster than a reviewer
# approves, and a branch-wide group would make a run that is still waiting for
# its approval block the *next* merge from even building. Serialising the part
# that actually touches the host is the deploy job's own concurrency group,
# below — that is where the race actually is.
concurrency:
  group: release-${{ github.event.inputs.ref || github.sha }}
  cancel-in-progress: false

# ---- Deployment topology. Change a value here, not in the steps. ----
env:
  APP_DIR: /opt/app/greenline-wms-fe
  WEB_IMAGE: greenline-wms-fe
  # Also the hostname the backend's edge nginx proxies to (its WEB_UPSTREAM).
  WEB_CONTAINER: greenline-wms-fe
  NETWORK_NAME: greenline-net
  HEALTH_TIMEOUT: '90'
  KEEP_IMAGES: '5'
  # The only branch production is ever built from.
  RELEASE_BRANCH: main

jobs:
  # ===========================================================================
  # 1. BUILD — verify the commit is on main, then build the nginx image on the VM.
  # ===========================================================================
  build:
    name: Verify commit and build image
    runs-on: ubuntu-latest
    environment: production
    env:
      SSH_HOST: ${{ secrets.SSH_HOST }}
      SSH_PORT: ${{ secrets.SSH_PORT || 22 }}
      SSH_USER: ${{ secrets.SSH_USER }}
      SSH_PASSWORD: ${{ secrets.SSH_PASSWORD }}
      # Baked into the bundle at build time: the site's public origin, no
      # trailing slash and no /api (the app appends that itself). Defaulted
      # rather than left to the variable alone — an unset value does not fail the
      # build, it ships a bundle pointing at http://localhost:3000, which looks
      # perfectly healthy and cannot reach the API from anyone's browser.
      VITE_API_URL: ${{ vars.VITE_API_URL || 'https://app.greenlinepetcare.co.th' }}
    outputs:
      image_tag: ${{ steps.resolve.outputs.image_tag }}
      sha: ${{ steps.resolve.outputs.sha }}
    steps:
      - name: Check out (for .github/actions/remote)
        uses: actions/checkout@v4
        with:
          # Full history: the guard below has to prove the commit is an ancestor
          # of main, which a shallow clone cannot answer.
          fetch-depth: 0

      - name: Resolve the commit and check it is on main
        id: resolve
        env:
          INPUT_REF: ${{ github.event.inputs.ref }}
        run: |
          set -euo pipefail

          # Refresh main explicitly. checkout@v4 with fetch-depth: 0 already
          # brings it, but a re-run of an older workflow would otherwise read a
          # stale view of the branch.
          git fetch --no-tags --force origin "+refs/heads/${RELEASE_BRANCH}:refs/remotes/origin/${RELEASE_BRANCH}"

          if [ -n "$INPUT_REF" ]; then
            # A manual run may name an older commit on main — that is the
            # rollback path. Resolve it locally first, then as a remote ref.
            SHA="$(git rev-parse -q --verify "${INPUT_REF}^{commit}" \
                   || git rev-parse -q --verify "origin/${INPUT_REF}^{commit}" \
                   || true)"
            if [ -z "$SHA" ]; then
              echo "::error::ref '${INPUT_REF}' does not resolve to a commit in this repository"
              exit 1
            fi
          else
            SHA="${{ github.sha }}"
          fi

          # THE GATE. A push to main satisfies this trivially; a manual dispatch
          # from a feature branch, or naming a commit that was never merged, does
          # not. This is what makes "production only ever runs code from main"
          # true rather than a convention.
          if ! git merge-base --is-ancestor "$SHA" "origin/${RELEASE_BRANCH}"; then
            echo "::error::commit ${SHA} is not contained in origin/${RELEASE_BRANCH} — refusing to release"
            {
              echo "### Release refused"
              echo ""
              echo "Commit \`${SHA}\` is not on \`${RELEASE_BRANCH}\`."
              echo ""
              echo "Production only ever builds code that has been merged. Open a pull"
              echo "request into \`${RELEASE_BRANCH}\` and merge it — that alone starts this"
              echo "pipeline."
            } >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi

          {
            echo "sha=$SHA"
            # Same scheme as develop: the first 12 chars of the commit sha, so an
            # image on either host reads the same way and maps back to a commit.
            echo "image_tag=${SHA:0:12}"
          } >> "$GITHUB_OUTPUT"

          echo "==> Releasing ${SHA} as ${SHA:0:12}, confirmed on ${RELEASE_BRANCH}"

      - name: Sync checkout on the VM
        uses: ./.github/actions/remote
        with:
          host: ${{ env.SSH_HOST }}
          port: ${{ env.SSH_PORT }}
          username: ${{ env.SSH_USER }}
          password: ${{ env.SSH_PASSWORD }}
          envs: APP_DIR
          script: |
            set -Eeuo pipefail
            GIT_SHA='${{ steps.resolve.outputs.sha }}'
            GH_TOKEN='${{ github.token }}'
            cd "$APP_DIR"
            test -d .git || { echo "$APP_DIR is not a git checkout — clone the repository first"; exit 1; }
            echo "==> Syncing checkout to $GIT_SHA"
            git -c credential.helper= -c credential.helper='!f() { echo username=x-access-token; echo "password=$GH_TOKEN"; }; f' fetch --prune --tags origin
            git reset --hard "$GIT_SHA"
            git clean -fd

      - name: Build image
        uses: ./.github/actions/remote
        with:
          host: ${{ env.SSH_HOST }}
          port: ${{ env.SSH_PORT }}
          username: ${{ env.SSH_USER }}
          password: ${{ env.SSH_PASSWORD }}
          timeout: 30m
          envs: APP_DIR,WEB_IMAGE,VITE_API_URL
          script: |
            set -Eeuo pipefail
            bash "$APP_DIR/deploy/ci/pipeline.sh" build '${{ steps.resolve.outputs.image_tag }}' '${{ steps.resolve.outputs.sha }}'

  # ===========================================================================
  # 2. TEST — the image must serve the app, with the right API origin baked in.
  # ===========================================================================
  test:
    name: Smoke test the built image
    runs-on: ubuntu-latest
    needs: build
    environment: production
    env:
      SSH_HOST: ${{ secrets.SSH_HOST }}
      SSH_PORT: ${{ secrets.SSH_PORT || 22 }}
      SSH_USER: ${{ secrets.SSH_USER }}
      SSH_PASSWORD: ${{ secrets.SSH_PASSWORD }}
      # Must match the build job's value exactly: cmd_test greps the built assets
      # for it and fails when the bundle does not contain the origin we asked for.
      VITE_API_URL: ${{ vars.VITE_API_URL || 'https://app.greenlinepetcare.co.th' }}
    steps:
      - name: Check out (for .github/actions/remote)
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Serve the image and check it
        uses: ./.github/actions/remote
        with:
          host: ${{ env.SSH_HOST }}
          port: ${{ env.SSH_PORT }}
          username: ${{ env.SSH_USER }}
          password: ${{ env.SSH_PASSWORD }}
          envs: APP_DIR,WEB_IMAGE,VITE_API_URL
          script: |
            set -Eeuo pipefail
            bash "$APP_DIR/deploy/ci/pipeline.sh" test '${{ needs.build.outputs.image_tag }}'

  # ===========================================================================
  # 3. DEPLOY — HELD until a reviewer on the `production` environment approves.
  # ===========================================================================
  deploy:
    name: Deploy to production (manual approval)
    runs-on: ubuntu-latest
    needs: [build, test]
    # Only one rollout touches the production host at a time, even when several
    # merges are waiting for their approval.
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    environment:
      name: production
      url: https://app.greenlinepetcare.co.th
    env:
      SSH_HOST: ${{ secrets.SSH_HOST }}
      SSH_PORT: ${{ secrets.SSH_PORT || 22 }}
      SSH_USER: ${{ secrets.SSH_USER }}
      SSH_PASSWORD: ${{ secrets.SSH_PASSWORD }}
    steps:
      - name: Check out (for .github/actions/remote)
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Roll out and wait for health
        uses: ./.github/actions/remote
        with:
          host: ${{ env.SSH_HOST }}
          port: ${{ env.SSH_PORT }}
          username: ${{ env.SSH_USER }}
          password: ${{ env.SSH_PASSWORD }}
          envs: APP_DIR,WEB_IMAGE,WEB_CONTAINER,NETWORK_NAME,HEALTH_TIMEOUT
          script: |
            set -Eeuo pipefail
            bash "$APP_DIR/deploy/ci/pipeline.sh" deploy '${{ needs.build.outputs.image_tag }}'

      - name: Prune old images
        uses: ./.github/actions/remote
        with:
          host: ${{ env.SSH_HOST }}
          port: ${{ env.SSH_PORT }}
          username: ${{ env.SSH_USER }}
          password: ${{ env.SSH_PASSWORD }}
          envs: APP_DIR,WEB_IMAGE,KEEP_IMAGES
          script: |
            set -Eeuo pipefail
            bash "$APP_DIR/deploy/ci/pipeline.sh" prune '${{ needs.build.outputs.image_tag }}'

      - name: Summary
        if: always()
        run: |
          {
            echo "### Production deploy ${{ job.status }}"
            echo ""
            echo "| | |"
            echo "|---|---|"
            echo "| Image | \`${WEB_IMAGE}:${{ needs.build.outputs.image_tag }}\` |"
            echo "| Commit | \`${{ needs.build.outputs.sha }}\` |"
            echo "| Site | https://app.greenlinepetcare.co.th |"
            echo "| Triggered by | @${{ github.actor }} |"
          } >> "$GITHUB_STEP_SUMMARY"
